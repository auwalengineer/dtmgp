            for an already-established session's user being disabled mid-session --
            see docs/implementation-status.md's FND-008 row).
        '403': &id002
          description: PermissionError -- authenticated, but the caller's role or
            LGA scope does not permit this request. Every scope/role/company-boundary
            violation in dtmgp uses this class; see docs/naming-and-coding-conventions.md's
            API conventions section.
        '417': &id003
          description: ValidationError (Frappe's default for a bare frappe.throw(message))
            -- a business-rule violation, e.g. an invalid status transition or a required
            cross-referenced field.
