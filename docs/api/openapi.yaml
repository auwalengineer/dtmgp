    cookie) with an X-Frappe-CSRF-Token header on writes; there is no separate API-key
    auth scheme for this application. See docs/naming-and-coding-conventions.md's
    "API conventions" section for the response-envelope, pagination and error conventions
    this reflects.
servers:
- url: /
  description: Same-origin -- the Vue app and this API are served from the same Frappe
